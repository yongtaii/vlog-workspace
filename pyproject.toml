[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-vlog-editor"
version = "0.3.0"
description = "Natural daily/travel vlog editing with storyboards and incremental local renders"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.9", "Pillow>=11.1", "pillow-heif>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vlog-editor = "vlog_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
